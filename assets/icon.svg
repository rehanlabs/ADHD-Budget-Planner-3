<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d19"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>
    <linearGradient id="sageHorizon3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldSun3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="softGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)"/>
  
  <!-- Subtle organic inner boundary -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#1b382d" stroke-width="3" opacity="0.6"/>

  <!-- Serene Rising Horizon Arch (Financial Peace & Clarity) -->
  <path d="M112 360 C112 240 400 240 400 360" fill="none" stroke="#164e3b" stroke-width="8" stroke-linecap="round"/>
  <path d="M142 360 C142 260 370 260 370 360" fill="none" stroke="url(#sageHorizon3)" stroke-width="12" stroke-linecap="round" filter="url(#softGlow3)"/>

  <!-- Balancing Zen River Pebble -->
  <ellipse cx="256" cy="355" rx="110" ry="34" fill="#0d261e" stroke="#10b981" stroke-width="4"/>
  <ellipse cx="256" cy="350" rx="96" ry="26" fill="url(#sageHorizon3)" opacity="0.4"/>

  <!-- Rising Clarity Gold Sun (Safe to Spend Anchor) -->
  <circle cx="256" cy="275" r="46" fill="url(#goldSun3)" filter="url(#softGlow3)"/>
  <circle cx="256" cy="275" r="38" fill="#fef3c7" opacity="0.25"/>

  <!-- Zen Sparks -->
  <circle cx="170" cy="210" r="4" fill="#5eead4" opacity="0.7"/>
  <circle cx="342" cy="210" r="5" fill="#fef08a" opacity="0.8"/>
  <circle cx="256" cy="160" r="3" fill="#5eead4" opacity="0.5"/>
</svg>
